<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — SecureAuth</title>
  
  <link rel="stylesheet" href="assets/css/1-base.css" />
  <link rel="stylesheet" href="assets/css/2-layout.css" />
  <link rel="stylesheet" href="assets/css/3-components.css" />
</head>
<body>

  <div class="app-wrapper">

    <header class="app-header">
      <div class="app-logo">
        <img src="assets/img/logo.png" alt="Logo SecureAuth"
          style="max-height: 100px; width: auto; object-fit: contain; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);" />
      </div>
      <p class="logo-tagline">Painel de Controle</p>
    </header>

    <div class="form-card" role="main" style="text-align: center; padding: 3rem 2rem;">
      
      <div class="success-icon" style="margin: 0 auto 1.5rem; width: 60px; height: 60px; border-color: var(--cyan); background: rgba(0,229,255,0.1);">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 30px; height: 30px; stroke: var(--cyan);">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>

      <h1 class="form-title" style="color: var(--cyan); font-size: 1.8rem; margin-bottom: 1rem;">Bem-vindo ao Sistema!</h1>
      <p class="form-subtitle" style="font-size: 0.9rem; line-height: 1.5;">Sua autenticação foi realizada com sucesso e seus dados estão protegidos.</p>
      <a href="index.html" class="btn-primary" style="display: inline-block; margin-top: 2rem; text-decoration: none; max-width: 250px; text-align: center;">SAIR DO SISTEMA</a>
      
      </div>

    <div class="security-footer">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
      </svg>
      SESSÃO PRIVADA &bull; AMBIENTE SEGURO
    </div>

  </div>

</body>
</html>
